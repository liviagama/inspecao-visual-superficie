[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inspecao-visual-superficie"
version = "0.1.0"
description = "Pipeline de visão computacional para detecção de defeitos em superfícies metálicas"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
